[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrocalc"
version = "0.1.0"
description = "Orbital mechanics cheatsheet + interactive notebook tools"
readme = "README.md"
requires-python = ">=3.10"

# Core runtime deps (keep this lean)
dependencies = [
  "numpy",
  "scipy",
  "sympy",
  "matplotlib",
  "drawsvg",
]

[project.optional-dependencies]
# Jupyter/notebook experience (what your repo uses day-to-day)
notebook = [
  "ipykernel",
  "ipywidgets",
  "jupyter_contrib_nbextensions",
]

# Dev / test / repo hygiene tooling
dev = [
  "pytest",
  "pytest-cov",
  "nbstripout",
  "pre-commit",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
